# OmniClip relay: `npm run deploy -w @omniclip/relay` (needs a free Cloudflare account).
name = "omniclip-relay"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RelayRoom"

# SQLite-backed Durable Objects are on Cloudflare's free plan
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayRoom"]
