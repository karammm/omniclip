# Builds every installer and publishes a GitHub Release.
# Trigger: push a version tag, e.g. `git tag v0.2.0 && git push origin v0.2.0`
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (e.g. 0.2.0). Builds artifacts only; no release is published.
        required: true

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  mac:
    name: macOS (.dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/set-version.mjs "$VERSION"
      - run: npm run build:web
      # Signing and notarization run only when the secrets are set (see "Code signing" in the README)
      - name: Prepare signing
        env:
          CERT: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          API_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$CERT" ]; then
            echo "CSC_LINK=$CERT" >> "$GITHUB_ENV"
            echo "::add-mask::$CERT_PASSWORD"
            echo "CSC_KEY_PASSWORD=$CERT_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "::warning::MAC_CERTIFICATE_P12_BASE64 is not set; the Mac app is ad-hoc signed and macOS will warn on first open."
          fi
          if [ -n "$API_KEY" ]; then
            printf '%s' "$API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
            { echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8"; echo "APPLE_API_KEY_ID=$API_KEY_ID"; echo "APPLE_API_ISSUER=$API_ISSUER"; } >> "$GITHUB_ENV"
          elif [ -n "$CERT" ]; then
            echo "::warning::APPLE_API_KEY_P8 is not set; the Mac app is signed but not notarized."
          fi
      - name: Build dmg (Apple Silicon + Intel)
        working-directory: apps/desktop
        run: node build.mjs && npx electron-builder --mac --publish never --config builder.config.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          # signed builds also make a zip + latest-mac.yml so installed apps can update themselves
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*-mac-*.zip
            apps/desktop/release/*-mac-*.zip.blockmap
            apps/desktop/release/latest-mac.yml
          if-no-files-found: error

  windows:
    name: Windows (.exe + .msi)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/set-version.mjs "$env:VERSION"
      - run: npm run build:web
      - name: Build installers
        working-directory: apps/desktop
        # Azure Artifact Signing (or a .pfx) signs the app and both installers when the secrets are set
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
          AZURE_PUBLISHER_NAME: ${{ secrets.AZURE_PUBLISHER_NAME }}
          WIN_CSC_LINK: ${{ secrets.WIN_CERTIFICATE_PFX_BASE64 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD }}
        run: node build.mjs && npx electron-builder --win --publish never --config builder.config.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          # latest.yml + blockmap let installed apps update themselves
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.exe.blockmap
            apps/desktop/release/*.msi
            apps/desktop/release/latest.yml
          if-no-files-found: error

  linux:
    name: Linux (.AppImage + .deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/set-version.mjs "$VERSION"
      - run: npm run build:web
      - name: Build AppImage and deb
        working-directory: apps/desktop
        run: node build.mjs && npx electron-builder --linux --publish never --config builder.config.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          # latest-linux.yml lets the AppImage update itself
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/latest-linux.yml
          if-no-files-found: error

  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: node scripts/set-version.mjs "$VERSION"
      - run: npm run build -w @omniclip/mobile
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/omniclip.jks"
            echo "OMNICLIP_KEYSTORE=$RUNNER_TEMP/omniclip.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the APK is signed with a throwaway debug key, so it can't update an earlier install."
          fi
      - name: Build APK
        working-directory: apps/mobile/android
        env:
          OMNICLIP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OMNICLIP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OMNICLIP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon
          mkdir -p out && cp app/build/outputs/apk/release/app-release.apk "out/OmniClip-${VERSION#v}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: apps/mobile/android/out/*.apk
          if-no-files-found: error

  ios:
    name: iOS (unsigned .ipa)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/set-version.mjs "$VERSION"
      - run: npm run build -w @omniclip/mobile
      - name: Build unsigned app
        working-directory: apps/mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package .ipa
        working-directory: apps/mobile/ios/App
        run: |
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/App.app out/Payload/
          cd out && zip -qry "OmniClip-${VERSION#v}-ios-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: apps/mobile/ios/App/out/*.ipa
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows, linux, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Download

            | Device | File |
            | --- | --- |
            | **Mac** (Apple Silicon: M1/M2/M3/M4) | `OmniClip-*-mac-arm64.dmg` |
            | **Mac** (Intel) | `OmniClip-*-mac-x64.dmg` |
            | **Windows** (home) | `OmniClip-Setup-*-x64.exe` |
            | **Windows** (IT / managed PCs) | `OmniClip-*-x64.msi` |
            | **Linux** (any distro, updates itself) | `OmniClip-*-linux-x86_64.AppImage` |
            | **Linux** (Ubuntu / Debian) | `OmniClip-*-linux-amd64.deb` |
            | **Android** | `OmniClip-*-android.apk` |
            | **iPhone / iPad** | `OmniClip-*-ios-unsigned.ipa` (install with [Sideloadly](https://sideloadly.io) or AltStore, or build from source in Xcode) |

            If your computer warns that the app is from an unidentified developer, see [Install](https://github.com/karammm/omniclip#install) for the one-time steps.
